[/Script/NavigationSystem.NavigationSystemV1]
; Only the server pathfinds (infected); clients never need a navmesh.
bAllowClientSideNavigation=False
; Navigation per map:
;  - Proto (60 m test map): the navmesh is built at load on the server (RuntimeGeneration=Dynamic below).
;  - World (10 km): the navmesh is prebuilt offline into World Partition chunks by
;    Tools/build_world_nav.sh (WorldPartitionNavigationDataBuilder); the map's RecastNavMesh actor is
;    marked world-partitioned and only applies door/area modifiers at runtime.
; Runtime generation around invokers was tried first and doesn't work there: on a dedicated server the
; landscape heightfield never reaches the navmesh tiles (only buildings and roads did).

[/Script/NavigationSystem.RecastNavMesh]
; Built on the server at load from the NavMeshBoundsVolume in the map, and updated when doors move
; (a closed door leaf blocks the navmesh, an open one doesn't). Agent = infected capsule (r35 h90).
RuntimeGeneration=Dynamic
bForceRebuildOnLoad=True
; 50 m tiles: a 10 km map is 200 x 200 tiles (the tile grid is capped at 256 x 256).
TileSizeUU=5000.0
AgentRadius=35.0
AgentHeight=180.0

